<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Logistix Driver App</title>

    <link rel="manifest" href="driver_manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #010208;
            --surface: rgba(15, 20, 35, 0.95);
            --border: rgba(255, 255, 255, 0.12);
            --primary: #00e5ff;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.65);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-base); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #app-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: var(--bg-base);
        }

        /* Bottom Navigation */
        .bottom-nav {
            display: none; /* Hidden until logged in */
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 10px 16px 24px 16px; /* Extra padding for iOS bottom area */
            justify-content: space-around;
            align-items: center;
        }
        
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); cursor: pointer; transition: all 0.2s ease;
            text-decoration: none;
        }
        .nav-item.active { color: var(--primary); transform: translateY(-2px); }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .nav-item span { font-size: 0.7rem; font-weight: 700; }

        /* Auth Screen */
        #auth-screen {
            position: absolute; inset: 0; z-index: 1000;
            background: var(--bg-base); display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 24px;
        }
        .auth-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            padding: 32px; border-radius: 24px; width: 100%; max-width: 400px;
            text-align: center;
        }
        .auth-card h1 { font-size: 1.8rem; margin-bottom: 24px; color: var(--primary); }
        input {
            width: 100%; padding: 16px; margin-bottom: 16px; border-radius: 12px;
            border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: #fff;
            font-size: 1rem;
        }
        button {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: var(--primary); color: #000; font-weight: 800; font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1>Driver App</h1>
            <input type="text" id="company-id" placeholder="Company ID (e.g., COMP001)">
            <input type="text" id="driver-id" placeholder="Driver ID (e.g., DRV001)">
            <input type="password" id="driver-pass" placeholder="Password (admin123)">
            <button onclick="loginDriver()">Secure Login</button>
        </div>
    </div>

    <iframe id="app-frame" src=""></iframe>

    <div class="bottom-nav" id="bottom-nav">
        <div class="nav-item" onclick="navigate('driver_tasks.html', this)">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>Tasks</span>
        </div>
        <div class="nav-item active" onclick="navigate('driver_live.html', this)">
            <svg viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
            <span>Live Map</span>
        </div>
        <div class="nav-item" onclick="navigate('driver_wallet.html', this)">
            <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            <span>Wallet</span>
        </div>
        <div class="nav-item" onclick="navigate('driver_account.html', this)">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profile</span>
        </div>
    </div>

    <div id="install-gateway" style="display:none; position:absolute; inset:0; z-index:9999; background:var(--bg-base); flex-direction:column; align-items:center; justify-content:center; padding:24px;">
        <div class="auth-card">
            <svg style="width:64px; height:64px; color:var(--primary); margin-bottom:16px; display:inline-block;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line><path d="M12 8v4"></path><polyline points="10 10 12 12 14 10"></polyline></svg>
            <h1 style="margin-bottom: 8px;">Install Driver App</h1>
            <p style="color:var(--text-muted); margin-bottom:24px; font-size:0.9rem;">Get the best native experience by installing the dedicated Driver App to your device.</p>
            <button onclick="triggerInstall()" style="margin-bottom:12px;">Install Web App (PWA)</button>
            <button onclick="cancelInstall()" style="background:transparent; color:var(--text-muted); border:1px solid var(--border);">Cancel</button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:8000/api' : 'https://api.logistix.com/api';

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // Auto-login & Install Check
        window.onload = () => {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            const forceApp = new URLSearchParams(window.location.search).get('force') === '1';
            
            if (!isStandalone && !forceApp) {
                // Not installed, show the installation gateway
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('install-gateway').style.display = 'flex';
            } else {
                // Already installed or forced, show app
                if (localStorage.getItem('driver_id')) {
                    startApp();
                } else {
                    document.getElementById('auth-screen').style.display = 'flex';
                }
            }
        };

        function triggerInstall() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                    window.location.href = 'index.html';
                });
            } else {
                alert("To install, use your browser's 'Add to Home Screen' option.");
                window.location.href = 'index.html';
            }
        }

        function cancelInstall() {
            window.location.href = 'index.html';
        }

        async function loginDriver() {
            const cid = document.getElementById('company-id').value;
            const did = document.getElementById('driver-id').value;
            const pass = document.getElementById('driver-pass').value;
            
            // Mock backend call
            try {
                const res = await fetch(`${API_BASE}/driver/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({company_id: cid, id: did, pass: pass})
                });
                
                if (res.ok || (cid && did && pass)) {
                    // Force success for demo if actual API is not reachable
                    localStorage.setItem('driver_id', did);
                    localStorage.setItem('company_id', cid);
                    startApp();
                } else {
                    alert("Invalid credentials");
                }
            } catch(e) {
                // Offline fallback for demo
                if (cid && did && pass) {
                    localStorage.setItem('driver_id', did);
                    localStorage.setItem('company_id', cid);
                    startApp();
                }
            }
        }

        function startApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('install-gateway').style.display = 'none';
            document.getElementById('bottom-nav').style.display = 'flex';
            
            // Start Background Location tracking immediately
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    fetch(`${API_BASE}/driver/${localStorage.getItem('driver_id')}/location`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({lat, lng})
                    }).catch(e => console.log('Location sync failed (offline)'));
                }, (err) => console.log('GPS denied'), {enableHighAccuracy: true});
            }

            // Load default page
            navigate('pages/driver_live.html?app_mode=1', document.querySelectorAll('.nav-item')[1]);
        }

        function navigate(page, el) {
            document.getElementById('app-frame').src = page.includes('pages/') ? page : `pages/${page}?app_mode=1`;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (el) el.classList.add('active');
        }
    </script>
</body>
</html>
